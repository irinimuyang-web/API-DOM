<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fetch API Activity</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Country Explorer</h1>
        <p>JavaScript Fetch API</p>
    </header>

    <main>

        <section class="intro">
            <h2>Explore Countries</h2>

            <p>
                This website uses JavaScript to fetch country
                information from a public API.
            </p>

            <button id="loadCountries">
                 Load Countries
            </button>

            <p id="status">
                Click the button to load country information.
            </p>
        </section>

        <section class="countries-section">

            <h2>Country Information</h2>
            <input type="text" id="searchInput" placeholder="Search for a country name ...">
            <div id="countries-container"></div>

            <div id="countriesContainer" class="countries-container">
                <!-- Country cards will appear here -->
            </div>

        </section>

    </main>

    <footer>
        <p>JavaScript Fetch API Activity  2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
